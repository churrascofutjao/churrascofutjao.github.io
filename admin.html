<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Organizador · Churrasco</title>
<style>
:root{--bg:#f4f5f9;--surface:#fff;--fg:#141a33;--muted:#5a6180;--line:#d9dcea;--navy:#24307a;--sun:#f47b20;--ok:#1f6b3a;--ok-soft:#dcf0e2;--bad:#b3312f;--bad-soft:#f8dfdf;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0d1022;--surface:#161a33;--fg:#e8eaf5;--muted:#a0a6c4;--line:#2a2f52;--navy:#2a3794;--sun:#ff8a33;--ok:#3fa864;--ok-soft:#173523;--bad:#f06d6d;--bad-soft:#3d1b1f;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;padding:16px;max-width:760px;margin-inline:auto}
h1{font-size:22px;margin:4px 0 12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px}
input,button{font:inherit;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg)}
button{background:var(--navy);color:#fff;border:0;cursor:pointer;font-weight:600}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.kpi b{display:block;font-size:22px}.kpi span{font-size:12.5px;color:var(--muted)}
.row{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.nome{font-weight:700}.sub{font-size:13px;color:var(--muted);margin-top:2px}
.val{text-align:right;white-space:nowrap;font-weight:700}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px;margin-top:4px}
.ok{background:var(--ok-soft);color:var(--ok)}.nao{background:var(--bad-soft);color:var(--bad)}
.warn{font-size:12.5px;color:var(--sun);margin-top:4px}
.val button{margin-top:6px;font-size:14px}
.val button.pagar{background:var(--sun);color:#1a0d03}
.val button.desf{background:var(--ok-soft);color:var(--ok);border:1px solid var(--ok)}
.val button.edit{background:transparent;color:var(--navy);border:1px solid var(--line);font-size:13px}
@media (prefers-color-scheme:dark){.val button.edit{color:var(--fg)}}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-start;justify-content:center;padding:16px;overflow:auto;z-index:10}
#modal[hidden]{display:none}
#modal .box{background:var(--surface);border-radius:14px;padding:16px;width:100%;max-width:460px;margin-top:20px}
#modal label{display:block;font-size:13px;color:var(--muted);margin:10px 0 3px}
#modal input[type=text],#modal input[type=number]{width:100%}
#modal .chk{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:16px;color:var(--fg)}
#modal .chk input{width:20px;height:20px}
#modal .acoes{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
#modal .acoes button{flex:1}
#modal .cinza{background:var(--line);color:var(--fg)}
#modal .verm{background:var(--bad);color:#fff}
#mauto{font-size:12.5px;color:var(--muted);margin-top:3px}
#erro{color:var(--bad);margin-top:8px}
.top{display:flex;gap:8px;margin-bottom:12px}.top button{flex:none}
</style>
</head>
<body>
<h1>🍖 Churrasco · Organizador</h1>

<div id="login" class="card">
  <p style="margin-top:0">Digite a senha do organizador:</p>
  <div class="top" style="margin:0"><input id="senha" type="password" style="flex:1" autocomplete="current-password"><button id="entrar">Entrar</button></div>
  <div id="erro"></div>
</div>

<div id="painel" hidden>
  <div class="kpis" id="kpis"></div>
  <div class="top"><input id="busca" placeholder="Buscar nome…" style="flex:1"><button id="atualizar">Atualizar</button></div>
  <div class="top"><button id="zap" style="flex:1;background:#1f8f4e">📋 Copiar lista para o WhatsApp</button></div>
  <textarea id="zaptxt" rows="14" hidden readonly style="width:100%;margin-bottom:12px;font:inherit;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg)"></textarea>
  <div id="lista"></div>
</div>

<div id="modal" hidden><div class="box">
  <h2 style="margin:0 0 4px;font-size:18px">Editar inscrição</h2>
  <label for="m-nome">Nome</label><input id="m-nome" type="text">
  <label class="chk"><input id="m-bebe" type="checkbox"> Ele bebe chopp (R$ 80; senão R$ 50)</label>
  <label class="chk"><input id="m-esposa" type="checkbox"> Vai com a esposa (+R$ 30)</label>
  <label for="m-men">Filhos menores de 18 (R$ 30 cada)</label><input id="m-men" type="number" min="0" max="10">
  <label for="m-mb">Filhos 18+ que bebem (R$ 80 cada)</label><input id="m-mb" type="number" min="0" max="10">
  <label for="m-mn">Filhos 18+ que não bebem (R$ 50 cada)</label><input id="m-mn" type="number" min="0" max="10">
  <label for="m-valor">Valor a pagar (R$)</label><input id="m-valor" type="number" min="0" step="1">
  <div id="mauto"></div>
  <label for="m-obs">Observação</label><input id="m-obs" type="text">
  <div id="merro" style="color:var(--bad);margin-top:8px"></div>
  <div class="acoes"><button id="m-salvar">Salvar</button><button id="m-cancelar" class="cinza">Cancelar</button></div>
  <div class="acoes"><button id="m-remover" class="verm">🗑 Remover esta inscrição</button></div>
</div></div>

<script>
const ENDPOINT = 'https://script.google.com/macros/s/AKfycbxqgOhMPAJcbGDPCqZO1MtbRr_84sMASnHwoLOO8-ahV6SnQyRG2Rpkjyq1bdMEXkhomw/exec';
const $ = s => document.querySelector(s);
const brl = n => 'R$ ' + Number(n).toLocaleString('pt-BR', {minimumFractionDigits: 2, maximumFractionDigits: 2});
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let dados = [], senha = '';
try { senha = sessionStorage.getItem('adm') || ''; } catch (e) {}

async function carregar() {
  $('#erro').textContent = '';
  try {
    const j = await (await fetch(ENDPOINT + '?admin=' + encodeURIComponent(senha))).json();
    if (!j.ok) { $('#erro').textContent = j.erro || 'Erro.'; $('#login').hidden = false; $('#painel').hidden = true; return; }
    dados = j.itens;
    try { sessionStorage.setItem('adm', senha); } catch (e) {}
    $('#login').hidden = true; $('#painel').hidden = false; render();
  } catch (e) { $('#erro').textContent = 'Sem conexão. Tente de novo.'; }
}

function acomp(i) {
  const p = [];
  if (i.esposa) p.push('esposa');
  if (i.menores) p.push(i.menores + ' filho(s) <18');
  if (i.maioresBebem) p.push(i.maioresBebem + ' filho(s) 18+ bebem');
  if (i.maioresNao) p.push(i.maioresNao + ' filho(s) 18+ não bebem');
  return p.length ? 'Vai com: ' + p.join(', ') : 'Vai sozinho';
}

function render() {
  const pessoas = dados.reduce((a, i) => a + i.pessoas, 0);
  const total = dados.reduce((a, i) => a + i.valor, 0);
  const pago = dados.filter(i => i.pago).reduce((a, i) => a + i.valor, 0);
  $('#kpis').innerHTML =
    `<div class="kpi"><b>${dados.length}</b><span>inscrições</span></div>` +
    `<div class="kpi"><b>${pessoas}</b><span>pessoas</span></div>` +
    `<div class="kpi"><b>${brl(pago)}</b><span>recebido (${dados.filter(i => i.pago).length} pagos)</span></div>` +
    `<div class="kpi"><b>${brl(total - pago)}</b><span>a receber (total ${brl(total)})</span></div>`;
  const q = $('#busca').value.trim().toLowerCase();
  $('#lista').innerHTML = dados.map((i, n) => ({ i, n: n + 1 }))
    .filter(x => !q || x.i.nome.toLowerCase().includes(q))
    .map(({ i, n }) => `<div class="card"><div class="row"><div><div class="nome">${n}. ${esc(i.nome)}</div>
      <div class="sub">${i.bebe ? '🍺 bebe chopp' : 'não bebe'} · ${acomp(i)} · ${i.pessoas} pessoa(s)</div>
      <div class="sub">${esc(i.quando)}</div>
      ${i.obs ? `<div class="warn">⚠ ${esc(i.obs)}</div>` : ''}</div>
      <div class="val">${brl(i.valor)}<br><button class="${i.pago ? 'desf' : 'pagar'}" data-l="${i.linha}" data-n="${esc(i.nome)}" data-p="${i.pago ? 0 : 1}">${i.pago ? '✅ PAGO (desfazer)' : 'Marcar como PAGO'}</button><br><button class="edit" data-e="${i.linha}">✏️ Editar</button></div></div></div>`).join('')
    || '<p>Nenhuma inscrição.</p>';
}

$('#lista').addEventListener('click', async e => {
  const b = e.target.closest('button[data-l]'); if (!b) return;
  const marcar = b.dataset.p === '1';
  if (!marcar && !confirm('Desfazer o pagamento de ' + b.dataset.n + '?')) return;
  b.disabled = true; b.textContent = 'Salvando…';
  try {
    const j = await (await fetch(ENDPOINT, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ admin: senha, pagoLinha: Number(b.dataset.l), nome: b.dataset.n, pago: marcar }) })).json();
    if (!j.ok) alert(j.erro || 'Erro ao salvar.');
  } catch (x) { alert('Sem conexão. Tente de novo.'); }
  carregar();
});
/* ---- editar / remover inscrição ---- */
let EDIT = null, valorManual = false;
const n0 = v => Math.max(0, Math.min(10, Math.floor(Number(v)) || 0));
function valorAuto() {
  return ($('#m-bebe').checked ? 80 : 50) + ($('#m-esposa').checked ? 30 : 0)
    + n0($('#m-men').value) * 30 + n0($('#m-mb').value) * 80 + n0($('#m-mn').value) * 50;
}
function atualizaAuto() {
  const v = valorAuto();
  if (!valorManual) $('#m-valor').value = v;
  $('#mauto').textContent = 'Pelas regras: ' + brl(v) + (valorManual && Number($('#m-valor').value) !== v ? ' (você está usando outro valor)' : '');
}
$('#lista').addEventListener('click', e => {
  const b = e.target.closest('button[data-e]'); if (!b) return;
  EDIT = dados.find(x => String(x.linha) === b.dataset.e); if (!EDIT) return;
  $('#m-nome').value = EDIT.nome; $('#m-bebe').checked = EDIT.bebe; $('#m-esposa').checked = EDIT.esposa;
  $('#m-men').value = EDIT.menores; $('#m-mb').value = EDIT.maioresBebem; $('#m-mn').value = EDIT.maioresNao;
  $('#m-obs').value = EDIT.obs || ''; $('#m-valor').value = EDIT.valor; $('#merro').textContent = '';
  valorManual = true; atualizaAuto(); $('#modal').hidden = false;
});
['#m-bebe', '#m-esposa', '#m-men', '#m-mb', '#m-mn'].forEach(s => $(s).addEventListener('input', () => { valorManual = false; atualizaAuto(); }));
$('#m-valor').addEventListener('input', () => { valorManual = true; atualizaAuto(); });
$('#m-cancelar').onclick = () => { $('#modal').hidden = true; EDIT = null; };
async function enviarAdmin(corpo) {
  const j = await (await fetch(ENDPOINT, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ admin: senha, nome: EDIT.nome, ...corpo }) })).json();
  if (!j.ok) throw new Error(j.erro || 'Erro ao salvar.');
}
$('#m-salvar').onclick = async () => {
  if (!EDIT) return; const b = $('#m-salvar'); b.disabled = true; b.textContent = 'Salvando…';
  try {
    await enviarAdmin({ editarLinha: EDIT.linha, novoNome: $('#m-nome').value, bebe: $('#m-bebe').checked, esposa: $('#m-esposa').checked,
      menores: n0($('#m-men').value), maioresBebem: n0($('#m-mb').value), maioresNao: n0($('#m-mn').value),
      valor: Number($('#m-valor').value), obs: $('#m-obs').value });
    $('#modal').hidden = true; EDIT = null; carregar();
  } catch (x) { $('#merro').textContent = x.message === 'Failed to fetch' ? 'Sem conexão. Tente de novo.' : x.message; }
  b.disabled = false; b.textContent = 'Salvar';
};
$('#m-remover').onclick = async () => {
  if (!EDIT || !confirm('Remover a inscrição de ' + EDIT.nome + '? Isso apaga a linha da planilha.')) return;
  try { await enviarAdmin({ removerLinha: EDIT.linha }); $('#modal').hidden = true; EDIT = null; carregar(); }
  catch (x) { $('#merro').textContent = x.message; }
};

function textoZap() {
  const pessoas = l => l.reduce((a, i) => a + i.pessoas, 0);
  const linha = (i, n) => `${n}. ${i.nome}${i.pessoas > 1 ? ` (+${i.pessoas - 1})` : ''} – ${brl(i.valor)}`;
  const pg = dados.filter(i => i.pago), dev = dados.filter(i => !i.pago);
  const soma = l => l.reduce((a, i) => a + i.valor, 0);
  let t = '🍖 *CHURRASCO DO JAÓ – 15/11*\n\n';
  t += `✅ *PAGARAM* (${pg.length} inscrições · ${pessoas(pg)} pessoas)\n💵 *Total recebido: ${brl(soma(pg))}*\n`;
  t += pg.length ? pg.map((i, k) => linha(i, k + 1)).join('\n') : 'Ninguém ainda';
  t += `\n\n⏳ *FALTA PAGAR* (${dev.length} inscrições · ${pessoas(dev)} pessoas)\n💸 *Total a receber: ${brl(soma(dev))}*\n`;
  t += dev.length ? dev.map((i, k) => linha(i, k + 1)).join('\n') : 'Todos pagaram! 🎉';
  t += `\n\n👥 *Total de pessoas: ${pessoas(dados)}* (pagaram ${pessoas(pg)} · falta pagar ${pessoas(dev)})`;
  t += '\n\n👉 Inscrição: https://churrascofutjao.github.io';
  t += '\n\n💰 Pix (CPF): 00570735114\nGustavo Papini Gomes de Sousa\n\nVaga só garantida com o pagamento! 🙏';
  return t;
}
$('#zap').onclick = async () => {
  const t = textoZap(), a = $('#zaptxt');
  a.value = t; a.hidden = false;
  try { await navigator.clipboard.writeText(t); $('#zap').textContent = '✅ Copiado! Cole no WhatsApp'; }
  catch (e) { a.select(); $('#zap').textContent = 'Selecione o texto abaixo e copie'; }
  setTimeout(() => { $('#zap').textContent = '📋 Copiar lista para o WhatsApp'; }, 4000);
};
$('#entrar').onclick = () => { senha = $('#senha').value; carregar(); };
$('#senha').addEventListener('keydown', e => { if (e.key === 'Enter') $('#entrar').click(); });
$('#atualizar').onclick = carregar;
$('#busca').oninput = render;
if (senha) carregar();
</script>
</body>
</html>
